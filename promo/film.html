<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>树仁搭子 · 宣传片</title>
<style>

:root{

}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--paper)}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;font-synthesis:none}
.abs{position:absolute}
#film{position:absolute;inset:0;overflow:hidden;background:var(--paper)}
#world{position:absolute;inset:0;transform-origin:960px 540px}
.latin{font-family:"Latin",serif;font-style:italic;font-weight:400}
.tab{font-variant-numeric:tabular-nums}

/* ---------- 标题 ---------- */

.chint u{color:#fff;text-underline-offset:2px}
.crow{position:absolute;left:0;right:0;top:730px;display:grid;grid-template-columns:repeat(3,1fr);align-items:center;justify-items:center}

/* 今天 */
.card22{border-radius:22px;background:#fff;padding:18px 18px 16px;display:flex;flex-direction:column;gap:16px;box-shadow:0 1px 2px rgba(28,35,32,.04)}

.pk{flex:1;border-radius:18px;background:#fff;overflow:hidden}
.pk .pi{height:112px;background:var(--mat);position:relative}
.pk .pi img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply}

.pk b{font:600 15px/1.4 var(--sans)}

/* ---------- 共同空闲（S3） ---------- */

<div id="film"><div id="world">
  <div id="s1"></div>

  <div id="titles"></div>

<script>
/* =====================================================================
   树仁搭子宣传片：画面完全由时间 t 决定，window.seek(t) 画出第 t 秒的一帧。
   不配字幕、不配音，只有动效和标题。
   ===================================================================== */
const DURATION = 52;
window.DURATION = DURATION;

/* ---------- 数学 ---------- */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,p)=>a+(b-a)*p;
const prog=(t,a,b)=>clamp((t-a)/(b-a));
const E={
  lin:x=>x, out:x=>1-Math.pow(1-x,3), out5:x=>1-Math.pow(1-x,5), in:x=>x*x*x,
  io:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
  io5:x=>x<.5?16*x*x*x*x*x:1-Math.pow(-2*x+2,5)/2,
  back:(x,s=1.70158)=>1+(s+1)*Math.pow(x-1,3)+s*Math.pow(x-1,2),
};
const tw=(t,a,b,ease=E.out)=>ease(prog(t,a,b));
const bump=(t,a,m,b)=>t<=a||t>=b?0:(t<m?E.io((t-a)/(m-a)):E.io(1-(t-m)/(b-m)));
/** 与网页里 motion 的 spring（stiffness 420, damping 34）同样的弹簧：返回 0→1 */
function spring(dt,k=420,d=34){if(dt<=0)return 0;const w0=Math.sqrt(k),z=d/(2*w0);if(z>=1)return 1-Math.exp(-w0*dt)*(1+w0*dt);const wd=w0*Math.sqrt(1-z*z);return 1-Math.exp(-z*w0*dt)*(Math.cos(wd*dt)+(z*w0/wd)*Math.sin(wd*dt))}
const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
function show(el,on){el.style.display=on?'':'none'}
const P='/public/assets/species/';

/* ---------- 图标（与 src/components/icons.tsx 同一组） ---------- */
const ic=(d,s=24,w=1.9,extra='')=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${extra}>${d}</svg>`;
const I={
  today:'<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/>',
  people:'<circle cx="9" cy="9" r="3.5"/><path d="M3 19c.6-3 3-4.5 6-4.5s5.4 1.5 6 4.5M16 6.5a3 3 0 0 1 0 5.6M18 14.8c1.6.6 2.6 2 3 4.2"/>',
  community:'<path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v10a2.5 2.5 0 0 1-2.5 2.5H8l-4 3z"/><path d="M8 9h8M8 13h5"/>',
  bubble:'<path d="M12 4c4.7 0 8.5 3.1 8.5 7s-3.8 7-8.5 7c-1 0-2-.1-2.9-.4L4.5 20l1.1-3.7C4.3 15 3.5 13.1 3.5 11c0-3.9 3.8-7 8.5-7z"/>',
  camera:'<path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2.2l1.4-2h5.8l1.4 2h2.2A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z"/><circle cx="12" cy="13" r="3.4"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  book:'<path d="M5 4h10l4 4v12H5z"/><path d="M9 12h6M9 16h4"/>',

/* =====================================================================
   S5 · 真实的校园线稿（OpenStreetMap 楼栋轮廓），两个人在琳恩图书馆
   ===================================================================== */
let MAP=null;
async function buildMap(){
  const d=await (await fetch('/shared/data/campusBuildings.json')).json();
  const lib=d.places.find(p=>p.id==='lynn-library');
  const k=Math.cos(lib.lat*Math.PI/180)*111320, kl=110574;
  const pr=([lng,lat])=>[(lng-lib.lng)*k,-(lat-lib.lat)*kl];
  const path=pts=>'M'+pts.map(p=>pr(p).map(v=>v.toFixed(1)).join(' ')).join('L')+'Z';
  const bnd=d.campusBoundary.map(pr); const xs=bnd.map(p=>p[0]), ys=bnd.map(p=>p[1]);
  const bb={x0:Math.min(...xs),x1:Math.max(...xs),y0:Math.min(...ys),y1:Math.max(...ys)};
  const bldg=d.places.filter(p=>p.polygon).map(p=>({id:p.id,d:path(p.polygon),c:pr([p.lng,p.lat]),lib:p.id==='lynn-library'}));
  MAP={bb,bldg,boundary:path(d.campusBoundary)};
  let h=`<svg width="1920" height="1080"><g id="mg">`;
  h+=`<path id="mbd" d="${MAP.boundary}" fill="#EFEEE9" stroke="#B4B7B2" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`;
  bldg.forEach((b,i)=>{h+=`<path class="mb" data-i="${i}" d="${b.d}" fill="${b.lib?'#DDE8E4':'#E3E2DB'}" stroke="${b.lib?'#005C65':'#9EA29D'}" stroke-width="${b.lib?2.4:1}" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`});
  h+=`<circle id="r300" cx="0" cy="0" r="300" fill="rgba(0,92,101,.07)" stroke="#005C65" stroke-width="2.2" stroke-dasharray="8 7" vector-effect="non-scaling-stroke"/>`;
  h+=`<line id="rline" x1="0" y1="0" x2="300" y2="0" stroke="#005C65" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
  h+=`</g></svg>`;
  h+=`<div class="pin" id="pinA"><span class="pt"></span><span class="pa"><img src="${P}egret.jpg"></span><span class="tm" style="right:40px">18:04</span></div>`;
  h+=`<div class="pin" id="pinB"><span class="pt"></span><span class="pa"><img src="${P}kapok.jpg"></span><span class="tm" style="left:40px">18:21</span></div>`;
  h+=`<div id="rlab">300 米</div>`;
  h+=`<div id="bigSeal">${stampHTML('同时',150)}</div>`;
  $('#map').innerHTML=h;
  // 路径长度（画线稿用）
  const L=$('#mbd').getTotalLength(); $('#mbd').dataset.len=L;
}
const PA=[-48,-22], PB=[42,34]; // 两人的位置（米，相对图书馆中心），相距约 106 米

  const out=tw(u,11.45,12.15,E.in); M.style.opacity=1-out;
  // 镜头：先看整个校园，再推到琳恩图书馆
  const bb=MAP.bb; const s0=Math.min(980/(bb.x1-bb.x0),900/(bb.y1-bb.y0));
  const c0=[(bb.x0+bb.x1)/2,(bb.y0+bb.y1)/2];
  const z=tw(u,6.2,7.6,E.io5);
  const s=Math.exp(lerp(Math.log(s0),Math.log(0.9),z))*(1+0.06*tw(u,7.6,12.6,E.io)+0.25*out);
  const c=[lerp(c0[0],20,z),lerp(c0[1],30,z)];
  const SX=1330, SY=560;

  const scr=([x,y])=>[SX+(x-c[0])*s,SY+(y-c[1])*s];

  bd.style.strokeDasharray=L; bd.style.strokeDashoffset=L*(1-dp); bd.style.fillOpacity=tw(u,5.4,6.2);
  $$('.mb').forEach(p=>{const b=MAP.bldg[+p.dataset.i];const dist=Math.hypot(b.c[0],b.c[1]);const a=4.9+dist/1600*1.0;const q=tw(u,a,a+0.35);p.style.opacity=q});
  // 两个定位
  [['#pinA',PA,7.3],['#pinB',PB,7.75]].forEach(([sel,pos,a])=>{
    const el=$(sel); const [x,y]=scr(pos); const q=E.back(prog(u,a,a+0.45),1.8);
    el.style.left=x+'px'; el.style.top=(y-50*(1-clamp(q)))+'px'; el.style.opacity=tw(u,a,a+0.15);
    el.querySelector('.pa').style.transform=`scale(${0.6+0.4*q})`;
    el.querySelector('.tm').style.opacity=tw(u,a+0.35,a+0.6);
  });
  // 300 米：以先打卡的人为圆心
  const rc=$('#r300'), rl=$('#rline'); const rp=tw(u,8.3,9.3,E.io5);
  rc.setAttribute('cx',PA[0]); rc.setAttribute('cy',PA[1]); rc.setAttribute('r',Math.max(0.01,300*rp)); rc.style.opacity=tw(u,8.3,8.5);
  rl.setAttribute('x1',PA[0]); rl.setAttribute('y1',PA[1]); rl.setAttribute('x2',PA[0]+300*rp*Math.cos(-0.5)); rl.setAttribute('y2',PA[1]+300*rp*Math.sin(-0.5)); rl.style.opacity=tw(u,9.0,9.3);
  const [lx,ly]=scr([PA[0]+170*Math.cos(-0.5),PA[1]+170*Math.sin(-0.5)]);
  const lb=$('#rlab'); lb.style.left=(lx+10)+'px'; lb.style.top=(ly-34)+'px'; lb.style.opacity=tw(u,9.2,9.5);
  // 盖章：同时打卡
  const sp=tw(u,9.9,10.3,E.out5); const bs=$('#bigSeal');
  const [sx,sy]=scr([150,150]);
  bs.style.left=(sx-75)+'px'; bs.style.top=(sy-75)+'px'; bs.style.opacity=clamp(sp*2.5);
  bs.style.transform=`scale(${lerp(2.2,1,sp)}) rotate(${lerp(-22,-8,sp)}deg)`;
}

/* =====================================================================
   S7 · 片尾
   ===================================================================== */
function buildEnd(){
  $('#end').innerHTML=`<div class="duo" id="eA" style="width:170px;height:170px"><img src="${P}kapok.jpg"></div><div class="duo" id="eB" style="width:170px;height:170px"><img src="${P}egret.jpg"></div>
   <div id="lock" class="lk2" style="top:540px;position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:26px"><img src="/public/assets/brand/shield.png" style="height:92px"><b style="font:600 92px/1 var(--sans);letter-spacing:.04em">树仁搭子</b></div>
   <div id="url" style="top:690px">pair.moorn.online</div>
   <div id="org" class="o2" style="top:752px">南方科技大学 · 树仁书院</div>
   <div id="cred">博物画均为公有领域作品 · 校园楼栋 © OpenStreetMap contributors · 打卡照片为示意</div>`;
}
function drawEnd(t){
  const e=t-S7; const En=$('#end'); const on=e>-0.1; show(En,on); if(!on) return;
  const a=tw(e,0.25,1.0,E.out5), b=tw(e,0.4,1.15,E.out5), j=tw(e,0.9,1.6,E.io5);
  // 两个圆从两边靠拢，叠在一起
  const D=170, cy=360;
  const ax=lerp(960-260,960-(D/2-26),j), bx=lerp(960+260,960+(D/2-26),j);
  const eA=$('#eA'), eB=$('#eB');
  eA.style.left=(ax-D/2)+'px'; eA.style.top=(cy-D/2)+'px'; eA.style.opacity=a; eA.style.transform=`scale(${0.85+0.15*a})`; eA.style.zIndex=2;
  eB.style.left=(bx-D/2)+'px'; eB.style.top=(cy-D/2)+'px'; eB.style.opacity=b; eB.style.transform=`scale(${0.85+0.15*b})`;
  const lk=tw(e,1.35,2.05,E.out5); const L=$('.lk2'); L.style.opacity=lk; L.style.transform=`translateY(${(1-lk)*24}px)`; L.style.clipPath=`inset(0 0 ${(1-lk)*100}% 0)`;
  const u=tw(e,2.0,2.6,E.out5); $('#url').style.opacity=u; $('#url').style.transform=`translateY(${(1-u)*14}px)`;
  const o=tw(e,2.35,2.9,E.out5); $('.o2').style.opacity=o*.95; $('.o2').style.transform=`translateY(${(1-o)*12}px)`;
  $('#cred').style.opacity=tw(e,3.0,3.6)*.9;
  En.style.opacity=1-tw(t,DURATION-0.6,DURATION,E.in)*0;
}

/* =====================================================================
   SEEK
   ===================================================================== */
function seek(t){
  $('#world').style.transform=`scale(${1+0.006*Math.sin(t*0.23)})`;
  drawS1(t); drawS3(t); drawMap(t); drawTitles(t); drawMainPhone(t); drawCams(t); drawEnd(t);
}
window.seek=seek;

window.READY=(async()=>{
  buildS1(); buildTitles(); buildS3(); buildPhones(); buildEnd();
  await buildMap();
  await document.fonts.ready;
  await Promise.all([...document.images].map(im=>im.decode().catch(()=>{})));
  // 预载取景框会切换到的几张照片
  await Promise.all(['a','b'].flatMap(w=>[0,1,2,3].map(k=>{const im=new Image();im.src=`build/desk-${w}-${k}.jpg`;return im.decode().catch(()=>{})})));
  // 音效提示表（给 audio.py）
  const ev=[];
  MOSAIC.forEach((s,i)=>{const R=cellRect(i);ev.push({t:0.2+0.05*(R.c+R.r*1.7),type:'pop',v:0.35})});
  ev.push({t:2.55,type:'whoosh',v:0.5}); ev.push({t:3.6,type:'land'});
  ev.push({t:4.95,type:'whoosh',v:0.4}); ev.push({t:5.7,type:'thud',v:0.6}); ev.push({t:5.4,type:'brand'});
  ev.push({t:S2,type:'whoosh'});
  ev.push({t:PRESS.skip,type:'tap'}); ev.push({t:PRESS.skip+0.02,type:'swipe'});
  ev.push({t:PRESS.dislike,type:'tap'}); ev.push({t:PRESS.dislike+0.02,type:'swipe'});
  ev.push({t:S2+4.45,type:'chime'});
  ev.push({t:S3-0.2,type:'whoosh',v:0.6});
  for(let d=0;d<7;d++)for(let p=0;p<8;p++){} // 格子出现太密，不逐个出声
  ev.push({t:S3+0.5,type:'shimmer'});
  ev.push({t:S3+2.3,type:'whoosh',v:0.7});
  COMMON.forEach((_,j)=>ev.push({t:S3+3.35+0.17*j,type:'step',v:j}));
  ev.push({t:S4-0.2,type:'whoosh',v:0.6});
  ev.push({t:PRESS.like,type:'tap'}); ev.push({t:PRESS.like+0.6,type:'stamp',v:0.8}); ev.push({t:PRESS.like+0.62,type:'notif'});
  ev.push({t:PRESS.chat,type:'tap'}); ev.push({t:PRESS.chat+0.05,type:'swipe',v:0.6});
  CHAT_AT.slice(1).forEach(a=>ev.push({t:PRESS.chat+a,type:'msg'})); ev.push({t:PRESS.chat+1.75,type:'notif'});
  ev.push({t:PRESS.accept,type:'tap'}); ev.push({t:PRESS.accept+0.12,type:'commit'});
  ev.push({t:S5,type:'whoosh'});
  [SHOT_A,SHOT_B].forEach(s=>{ev.push({t:s,type:'shutter'});ev.push({t:s+0.78,type:'commit'})});
  ev.push({t:S5+4.7,type:'whoosh',v:0.6}); ev.push({t:S5+4.8,type:'draw'});
  ev.push({t:S5+6.2,type:'whoosh',v:0.5});
  ev.push({t:S5+7.3,type:'drop'}); ev.push({t:S5+7.75,type:'drop'});
  ev.push({t:S5+8.3,type:'rise'});
  ev.push({t:S5+9.9,type:'stamp',v:1.3});
  ev.push({t:S6-0.2,type:'whoosh',v:0.6});
  [1.6,2.1,2.6,3.1].forEach((a,j)=>ev.push({t:S6+a,type:'step',v:j}));
  ev.push({t:S6+3.7,type:'chime'});
  ev.push({t:S7-0.2,type:'whoosh',v:0.6});
  ev.push({t:S7+1.45,type:'thud',v:0.9}); ev.push({t:S7+1.5,type:'final'});
  window.EVENTS=ev.sort((a,b)=>a.t-b.t);
  seek(0);
  return true;
})();

// 预览：?play=1（&from=秒）；?t=秒 定格
const Q=new URLSearchParams(location.search);
if(Q.get('play')){window.READY.then(()=>{const t0=performance.now(),from=+Q.get('from')||0;const loop=()=>{seek((from+(performance.now()-t0)/1000)%DURATION);requestAnimationFrame(loop)};loop()})}
if(Q.get('t')){window.READY.then(()=>seek(+Q.get('t')))}
</script>
</body>
